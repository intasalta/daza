name: Actualizar Datos DAZA

on:
  schedule:
    - cron: '10,40 * * * *'
  workflow_dispatch:

jobs:
  descargar-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Copiar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright pandas openpyxl
          playwright install chromium

      - name: Configurar Git y actualizar repositorio
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git pull --rebase || true

      - name: Ejecutar descarga diaria
        run: python descargar_diario.py

     

      - name: Subir captura de error si falla
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-error
          path: error_*.png

      - name: Guardar cambios en el repositorio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add *_station_data.* 2>/dev/null || true
          git add stats_*.json 2>/dev/null || true
          git commit -m "Actualización automática de estaciones meteorológicas [skip ci]" || echo "No hay cambios para commitear"
          git push
