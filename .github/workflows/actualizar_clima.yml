name: Actualizar Datos Ecowitt (Modo Rápido Directo)

on:
  schedule:
    # Se ejecuta cada 15 minutos automáticamente
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  descargar-datos:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependencias ligeras (Sin navegadores ni Playwright)
        run: |
          pip install pandas openpyxl

      - name: Descargar datos directamente desde Ecowitt (Enlace público sin login)
        run: |
          python descargar_share.py
          
      - name: Guardar y sincronizar cambios en GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Primero agregamos los archivos descargados y commiteamos
          git add *_station_data.*
          git commit -m "Actualización automática de datos climáticos (.xls, .csv, .xlsx) [skip ci]" || echo "No hay cambios para commitear"
          
          # Luego sincronizamos con rebase y enviamos
          git pull --rebase --autostash origin main || git pull --rebase origin main || true
          git push origin main
